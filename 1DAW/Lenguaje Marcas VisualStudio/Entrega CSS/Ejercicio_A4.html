<html>
<head>
	<meta charset="UTF-8">
	<style>
		/* Ángels Salinas Tinizaray */

		/* Se establece color del fondo verde*/
		body {
			background-color: rgb(97, 216, 97);
		}

		/* Reseteo de la lista para quitar los puntos y márgenes*/
		ul {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		/* Convierte los elementos de lista verticales en horizontales */
		li {
			display: inline-block;
			margin: 10;
			padding: 10px 1px;
		}

		/* Le quita lo subrayado a los enlaces y todos los enlaces son blancos*/
		a {
			text-decoration: none;
			color: white;
		}

		/* Cuando el cursor esta sobre los enlaces aparece un recuadro azul encima*/
		a:hover {
    		padding: 8px;
			background-color: blue;
		}


	</style>
</head>
<body>
	<ul class="xul">
		<li class="xli">
			<a href="#Inicio">Inicio</a>
		</li>
		<li class="xli">
			<a href="#Quienes-Somos">¿Quienes Somos?</a>
		</li>
		<li class="xli">
			<a href="#Contacto">Contacto</a>
		</li>
	</ul>
</body>
</html>
