<html>
	<head>
		<title>Ejercicio A1</title>
		<style>
			/* Ángels Salinas Tinizaray */
			
			/* Selector universal para aplicar a todas las etiquetas de texto esta fuente */
			* {
				font-family: Verdana, Geneva, Tahoma, sans-serif;
			}
			/* Clase para texto azul */
			p.azul{
				color: blue;
			}

			/* Clase para texto rojo */
			p.rojo{
				color: red;
			}
		</style>
	</head>
	<body>
		<p class="azul"><b>Soy Azul</b></p>
		<p class="rojo"><b>Soy Rojo</b></p>
	</body>
</html>
