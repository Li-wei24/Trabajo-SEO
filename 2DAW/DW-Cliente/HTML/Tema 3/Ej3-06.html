<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
        let array = [true, false, true, false, true, false, true, false,true, false];
        let posicion = 0;

        while (posicion < array.length){
            if (array[posicion] == true){
                document.write(`<p>Posicion: ${posicion}</p>`)
            }

            posicion ++;
        }
    </script>
