    <script>
        let conjunto = new Set();
        let array1 = [12, 12, 12, 14];
        let array2 = [11, 11, 13, 15];
        let array3 = ["i", "j", "k", "l"];

        for (let elemento of conjunto){
            console.log(elemento);
        }

        console.log(conjunto.size);

        //Pues porque ese es el orden de insercion que le di
    </script>
