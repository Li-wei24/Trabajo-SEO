<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let textoA = ['sol', 'luz', 'día', 'calor'];
        let textoB = ['noche', 'luz', 'sol', 'frío'];
        let resultado = [];

        for (let palabras of textoA){
            for (let palabritas of textoB){
                if (palabras === palabritas){
                    resultado[resultado.length] = " " + palabras;
                }
            }
        }

        document.write(`<p>${resultado}</p>`);
    </script>
</body>
</html>
