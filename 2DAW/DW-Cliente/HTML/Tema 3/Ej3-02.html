<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let colores = [
            ["Naranja", "#F39C12"],
            ["Lima", "#C0F312"],
            ["Turquesa", "#12F3E5"],
            ["Rosa", "#F312AF"],
            ["Rojo", "#F31212"]
        ];

        document.write("<ul>");
        
        for (let i = 0; i < colores.length; i++) {
            let nombre = colores[i][0]; 
            let codigo = colores[i][1];

            document.write(`<li>${nombre}: ${codigo}</li>`);
        }
        
        document.write("</ul>");
    </script>
</body>
</html>
