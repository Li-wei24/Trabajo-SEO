<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const encontrarNumerosFaltantes = (lista) => {
        // 1. Calculamos n (el mayor entre el número más alto del array y su longitud)
        const n = Math.max(...lista, lista.length);

        // 2. Creamos un Set con la lista para eliminar duplicados y buscar rápido
        const numerosUnicos = new Set(lista);

        // 3. Creamos un array para guardar los que falten
        const faltantes = [];

        // 4. Recorremos desde el 1 hasta n buscando ausencias
        for (let i = 1; i <= n; i++) {
            // Si el Set NO tiene el número 'i', significa que falta
            if (!numerosUnicos.has(i)) {
                faltantes.push(i);
            }
        }

        return faltantes;
        
        };

        // Pruebas del enunciado:
        console.log(encontrarNumerosFaltantes([1, 2, 4, 6]));          // [3, 5]
        console.log(encontrarNumerosFaltantes([4, 8, 7, 2]));          // [1, 3, 5, 6]
        console.log(encontrarNumerosFaltantes([3, 2, 1, 1]));          // [4]
        console.log(encontrarNumerosFaltantes([5, 5, 5, 3, 3, 2, 1])); // [4, 6, 7]
    </script>
</body>
</html>
