<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        const numeros = [5, 3, 8, 3, 1, 5, 10, 2];
        const resultado = (numeros) => {
            
            return numeros.filter((num, i) => numeros.indexOf(num)=== i).sort((a, b) => a-b);

            
        }
        console.log(resultado(numeros)); // [1, 2, 3, 5, 8, 10]

    </script>
</body>
</html>
