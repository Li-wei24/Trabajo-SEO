<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const invertida = function(palabra){
                let resultado = '';

                let palabraPartes = palabra.split('');

                for (let i = palabraPartes.length -1; i >= 0; i--){
                    resultado += palabraPartes[i];
                }

                console.log(`Este es el resultado:${resultado}`);

                return resultado;

            }

        invertida('keka');
    </script>
</body>
</html>
