<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Dale una vuelta xd
        class Coche {
            constructor(marca, modelo, anio) {
                this.marca = marca;
                this.modelo = modelo;
                this.anio = anio;
            }
        }

        const misCoches = [
            new Coche("Ferrari", "Scaglietti", 2010),
            new Coche("BMW", "Z4", 2010),
            new Coche("Seat", "Toledo", 1999),
            new Coche("Fiat", "500", 1995)
        ];

        function mostrarAlertaCoches(array) {
            let mensaje = "marca --- modelo --- año\n";
            
            array.forEach(coche => {
                mensaje += `${coche.marca} --- ${coche.modelo} --- ${coche.anio}\n`;
            });

            alert(mensaje);
        }

        mostrarAlertaCoches(misCoches);
    </script>
</body>
</html>
