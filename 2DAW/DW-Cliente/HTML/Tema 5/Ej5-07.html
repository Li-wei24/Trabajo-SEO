<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tiempoInicio = Date.now();

        let respuesta = prompt("¿Cómo se llama la estrategia de resolver problemas en subproblemas más pequeños?");

        let tiempoFin = Date.now();

        let tiempoTotalSegundos = (tiempoFin - tiempoInicio) / 1000;

        alert(`Has tardado ${tiempoTotalSegundos} segundos en responder.`);
        console.log(`Respuesta dada: "${respuesta}". Tiempo transcurrido: ${tiempoTotalSegundos} segundos.`);
    </script>
</body>
