<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>

</head>

<body>
    <script>
        let columnas = prompt("Inserta num columnas! ");
        let altura = prompt("Inserta altura! ");
        let anchura = prompt("Inserta anchura! ");

        document.write("<table>");
            document.write("<tr>");
            for (let i = 1; i <= columnas; i++){
                if (i % 2 == 0){
                    document.write(`<td style="height: ${altura}px; width:${anchura}px;" bgcolor = "white"> </td>`);
                
                }

                else{
                    document.write(`<td style="height: ${altura}px; width:${anchura}px;" bgcolor = "black"> </td>`);

                }
            }
        document.write("</tr>");

        document.write("</table>");
    </script>
</body>
</html>
