<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <script>
        let anchura = prompt("Inserta anchura! ");

        document.write("<table>");
        for (let j = 1; j <= 8; j++){
            document.write("<tr>");

            for (let i = 1; i <= 8; i++){
                if (j % 2 == 0) {                    
                    if (i % 2 == 0){
                    document.write(`<td style="height: ${anchura}px; width:${anchura}px;" bgcolor = "white"> </td>`);
                    
                    }

                    else{
                        document.write(`<td style="height: ${anchura}px; width:${anchura}px;" bgcolor = "black"> </td>`);

                    }
                }

                else if (j % 2 != 0) {
                    if (i % 2 != 0) {
                        document.write(`<td style="height: ${anchura}px; width:${anchura}px;" bgcolor = "white"> </td>`);

                    }

                    else {
                        document.write(`<td style="height: ${anchura}px; width:${anchura}px;" bgcolor = "black"> </td>`);

                    }
                }

            }

            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
