<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        for (let i = 1; i <= 4; i++){
            let posCorredor = parseInt(prompt(`Inserta la posicion del jugador ${i}`));
            let carril = '';

            for (let j = 1; j <= 10; j++){
                if (posCorredor == j){
                    carril += 'c';
                }

                else {
                    carril += '~';
                }

            }

            carril += `/${i}`
            document.write(`<p> ${carril} </p>`)
        }
    </script>
</body>
</html>
