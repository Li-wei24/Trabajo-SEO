<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("Vamos a solicitar unos numeros al usuario...");

        let num1 = parseInt( prompt("Inserta el primer numero: "));
        let num2 = parseInt( prompt("Inserta el segundo numero: "));

        if (num1 === 0 || num2 === 0) {
            alert("Esta operación no se puede realizar al dividir entre 0...");
        } 
        else if (isNaN(num1) || isNaN(num2)) {
            alert("Por favor introduce numeros");
        } 
        else {
            console.log("Realizando operación...");
            alert("Resultado: " + (num1 / num2));

            console.log("Operacion realizada con exito!")
        }
    </script>
</body>
</html>
